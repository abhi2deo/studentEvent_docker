<!DOCTYPE html>
<html>
<head>
    <title>Student Event Registration</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #e8f1f8;
            margin: 0;
            padding: 40px;
        }

        .container {
            width: 600px;
            margin: auto;
            background-color: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2);
        }

        h1 {
            text-align: center;
            color: #1f4e79;
        }

        h2 {
            color: #333;
        }

        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
        }

        input, select {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 12px;
            background-color: #1f4e79;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background-color: #163a5c;
        }

        .description {
            text-align: center;
            color: #555;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Student Event Registration</h1>

    <h2>TechFest 2026</h2>

    <p class="description">
        Join us for TechFest 2026, an exciting event featuring
        technology, innovation and programming activities.
    </p>

    <form>

        <label>Student Name</label>
        <input type="text" name="studentName" placeholder="Enter your name">

        <label>Register Number</label>
        <input type="text" name="registerNumber" placeholder="Enter register number">

        <label>Department</label>
        <input type="text" name="department" placeholder="Enter department">

        <label>Email</label>
        <input type="email" name="email" placeholder="Enter email">

        <label>Event Date</label>
        <input type="date" name="eventDate">

        <button type="submit">Register for Event</button>

    </form>

</div>

</body>
</html>
